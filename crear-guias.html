<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <style>
    :root {
      color-scheme: light;
      --brand-orange: #f97316;
      --page-bg: #e9ecef;
      --surface: #ffffff;
      --text-main: #0f172a;
      --text-muted: #475569;
      --border-color: #cbd5e1;
    }
    body {
      min-height: 100vh;
      margin: 0;
      background:
        radial-gradient(ellipse at top, rgba(249, 115, 22, 0.07), transparent 38rem),
        var(--page-bg);

      font-family: system-ui, -apple-system, sans-serif;
    }
    .topbar {
      background: #000000;
      border-bottom: 3px solid var(--brand-orange);
    }
    .topbar-inner {
      min-height: 87px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }
    .topbar img {
      width: auto;
      max-width: min(220px, 55vw);
      height: auto;
      max-height: 55px;
      object-fit: contain;
    }
    .back-button {
      width: 42px;
      min-width: 42px;
      height: 42px;
      min-height: 42px;
      padding: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1px solid #3a3a3a;
      border-radius: 12px;
      background: #242424;
      color: #ffffff;
      text-decoration: none;
      font-size: 1.25rem;
      -webkit-tap-highlight-color: transparent;
      transition: border-color 0.18s ease, color 0.18s ease;
    }
    .back-button:hover,
    .back-button:focus-visible {
      border-color: var(--brand-orange);
      color: var(--brand-orange);
    }
    main {
      width: min(100% - 32px, 820px);
      margin: 40px auto;
    }
    .form-card {
      padding: clamp(22px, 4.5vw, 42px);
      border: 1px solid #d6dde7;
      border-radius: 22px;
      background: var(--surface);
      box-shadow: 0 18px 48px rgba(15, 23, 42, 0.09);
    }
    .form-heading {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 28px;
      padding-bottom: 22px;
      border-bottom: 1px solid #e8edf3;
    }
    .form-heading-icon {
      width: 48px;
      min-width: 48px;
      height: 48px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(249, 115, 22, 0.18);
      border-radius: 15px;
      background: #fff7ed;
      color: var(--brand-orange);

    .google-login-card {

    .pdf-folder-card {
      padding: 14px 20px;
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      background: #fff;
    }
    .google-login-copy {
      display: flex;
      align-items: flex-start;
      gap: 13px;
      min-width: 0;
    }
    .google-login-icon {
      width: 40px;
      min-width: 40px;
      height: 40px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(249, 115, 22, 0.18);
      border-radius: 12px;
      background: #ffffff;
      color: var(--brand-orange);
      font-size: 1.1rem;
    }
    .google-login-title {
      margin: 0 0 3px;
      color: var(--text-main);
      font-size: 0.98rem;
      font-weight: 700;

    .google-login-status {
      min-height: 0;
      margin: 0 !important;
      color: var(--text-muted);

      font-weight: 450;
      line-height: 1.4;
    }
    .google-login-status.error {
      color: #b91c1c;
      font-weight: 600;
    }
    .google-login-status.success {
      color: #166534;
      font-weight: 600;
    }
    #botonGoogleGuias {
      width: 180px;
      min-width: 180px;
      display: flex;
      justify-content: flex-end;
    }
    .google-login-confirmation {
      min-height: 40px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 0 16px;
      border: 1px solid #bbf7d0;
      border-radius: 999px;
      background: #f0fdf4;

      font-size: 0.9rem;

    .outlined-field {

    .client-suggestions {

      right: 0;

      margin: 0;

    .client-suggestions button:hover,

    .client-suggestion-name {

    .outlined-field .form-label {

      z-index: 1;
      top: -0.82rem;
      left: 17px;
      margin: 0;
      padding: 0 7px;
      background: #ffffff;
      color: #30343d;
      font-size: 0.98rem;
      font-weight: 600;
      line-height: 1.25;
    }
    .outlined-field .form-control {
      width: 100%;
      min-height: 68px;
      padding: 17px 58px 14px 20px;
      border: 0;
      border-radius: inherit;
      background: transparent;
      box-shadow: none;
      color: #30343d;
      font-size: clamp(1rem, 2.2vw, 1.3rem);
    }
    .outlined-field .form-control:focus {
      background: transparent;
      box-shadow: none;
    }
    #nombreCliente::-webkit-search-cancel-button {
      -webkit-appearance: none;
      appearance: none;
      display: none;
    }
    .outlined-field textarea.form-control {
      min-height: 94px;
      resize: vertical;
    }
    .clear-field {
      position: absolute;
      top: 50%;
      right: 15px;
      width: 34px;
      height: 34px;
      padding: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transform: translateY(-50%);
      border: 0;
      border-radius: 50%;
      background: transparent;
      color: #3b3b3b;
      font-size: 1.35rem;
      line-height: 1;
    }
    .clear-field:hover,
    .clear-field:focus-visible {
      background: #f1f5f9;
      color: var(--brand-orange);
      outline: none;
    }
    .btn-primary {
      min-height: 54px;
      border-color: var(--brand-orange);
      background: var(--brand-orange);
      font-weight: 650;
      border-radius: 12px;
      box-shadow: 0 6px 14px rgba(249, 115, 22, 0.2);
      transition: transform 0.18s ease, box-shadow 0.18s ease, background-color 0.18s ease;
    }
    .btn-primary:hover,
    .btn-primary:focus {
      border-color: #ea580c;
      background: #ea580c;
      box-shadow: 0 8px 18px rgba(249, 115, 22, 0.26);
      transform: translateY(-1px);

    .btn-primary:active {

    .status-message {
      min-height: 1.25rem;
      margin-top: 12px !important;
      margin-bottom: 0 !important;
      font-size: 0.92rem;
      font-weight: 600;
    }
    .status-message + .btn-primary {
      margin-top: 4px !important;
    }
    .status-message.error {
      color: #b91c1c;
    }
    .status-message.success {
      color: #166534;
    }
    @media (max-width: 575.98px) {
      main {
        width: min(100% - 24px, 480px);
        margin: 22px auto;
      }
      .form-card {
        padding: 22px 18px;
        border-radius: 18px;
      }
      .form-heading {
        gap: 12px;
        margin-bottom: 22px;
        padding-bottom: 18px;
      }
      .google-login-card,
      .pdf-folder-card {
        align-items: flex-start;
        flex-direction: column;
        gap: 12px;
        margin-bottom: 24px;
        padding: 16px;
      }
      #botonGoogleGuias {
        width: 100%;
        min-width: 0;
        justify-content: flex-start;
        padding-left: 53px;
      }
      .form-heading-icon {
        width: 42px;
        min-width: 42px;
        height: 42px;
        border-radius: 13px;
      }
      #formularioGuias .row {
        --bs-gutter-y: 1.4rem;
      }
      .outlined-field {
        border-radius: 14px;
      }
      .outlined-field .form-control {
        min-height: 64px;
        padding-left: 16px;
        font-size: 1.05rem;
      }
      .outlined-field textarea.form-control {
        min-height: 88px;
      }
      .outlined-field .form-label {
        left: 13px;
      }
    }
  </style>
</head>

  <script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
  <script src="https://accounts.google.com/gsi/client" defer></script>
  <script>
    const URL_API_GUIAS = 'https://script.google.com/macros/s/AKfycbz6CAkq2nh-FnyUE6jE4dTmwPbIkFog10jEr4xuJp11-XbqB_mceR5AAiIhuuoIiw8kCg/exec';
    const GOOGLE_CLIENT_ID_GUIAS = '359363906061-o8q5s2068sbbmon7ohsgnvctvlm12ls6.apps.googleusercontent.com';
    const CORREO_AUTORIZADO_GUIAS = 'limzagroup0@gmail.com';
    const formularioGuias = document.getElementById('formularioGuias');
    const botonGenerarGuias = document.getElementById('btnGenerarGuias');
    const estadoGuias = document.getElementById('estadoGuias');
    const estadoSesionGuias = document.getElementById('estadoSesionGuias');
    const botonGoogleGuias = document.getElementById('botonGoogleGuias');
    const estadoAccesoGoogleGuias = document.getElementById('estadoAccesoGoogleGuias');
    const botonCerrarSesionGoogleGuias = document.getElementById('cerrarSesionGoogleGuias');
    const seleccionarCarpetaPdf = document.getElementById('seleccionarCarpetaPdf');
    const estadoCarpetaPdf = document.getElementById('estadoCarpetaPdf');
    const nombreClienteInput = document.getElementById('nombreCliente');
    const sugerenciasClientes = document.getElementById('sugerenciasClientes');
    const numeroGuiaInput = document.getElementById('numeroGuia');
    const claveSesionGoogleGuias = 'limzagroupSesionGoogleGuias';
    const numeroGuiaInicial = 540;
    const pdfError = 'No se pudo generar el PDF. Recarga la página e inténtalo de nuevo.';
    let clientesGuias = [];
    let clienteGuiaSeleccionado = null;
    let credencialGoogleGuias = '';
    let correlativoDisponible = false;
    let carpetaPdfGuias = null;
    const BD_CARPETA_PDF = 'limzagroupGuias';

    function abrirBaseDatosCarpeta() {
      return new Promise((resolve, reject) => {
        const solicitud = indexedDB.open(BD_CARPETA_PDF, 1);
        solicitud.onupgradeneeded = () => solicitud.result.createObjectStore('configuracion');
        solicitud.onsuccess = () => resolve(solicitud.result);
        solicitud.onerror = () => reject(solicitud.error);
      });
    }

    async function guardarCarpetaPdf(carpeta) {
      const bd = await abrirBaseDatosCarpeta();
      await new Promise((resolve, reject) => {
        const transaccion = bd.transaction('configuracion', 'readwrite');
        transaccion.objectStore('configuracion').put(carpeta, 'directorioPdfGuias');
        transaccion.oncomplete = resolve;
        transaccion.onerror = () => reject(transaccion.error);
      });
      bd.close();
    }

    async function recuperarCarpetaPdf() {
      const bd = await abrirBaseDatosCarpeta();
      const carpeta = await new Promise((resolve, reject) => {
        const solicitud = bd.transaction('configuracion', 'readonly').objectStore('configuracion').get('directorioPdfGuias');
        solicitud.onsuccess = () => resolve(solicitud.result);
        solicitud.onerror = () => reject(solicitud.error);
      });
      bd.close();
      return carpeta || null;
    }

    async function pedirPermisoCarpeta(carpeta, permitirSolicitar = false) {
      if (!carpeta?.queryPermission || !carpeta?.requestPermission) return false;
      let permiso = await carpeta.queryPermission({ mode: 'readwrite' });
      if (permiso !== 'granted' && permitirSolicitar) {
        permiso = await carpeta.requestPermission({ mode: 'readwrite' });
      }
      return permiso === 'granted';
    }

    async function seleccionarCarpetaGuias() {
      if (!window.showDirectoryPicker) {
        estadoCarpetaPdf.textContent = 'Esta función requiere Google Chrome o Microsoft Edge actualizado.';
        return;
      }
      try {
        carpetaPdfGuias = await window.showDirectoryPicker({ mode: 'readwrite' });
        if (!await pedirPermisoCarpeta(carpetaPdfGuias, true)) {
          estadoCarpetaPdf.textContent = 'Concede permiso de lectura y escritura en la ventana del navegador.';
          return;
        }
        await guardarCarpetaPdf(carpetaPdfGuias);
        estadoCarpetaPdf.textContent = `Carpeta guardada: ${carpetaPdfGuias.name}`;
        seleccionarCarpetaPdf.textContent = 'Cambiar carpeta';
      } catch (error) {
        if (error.name !== 'AbortError') {
          console.error('No se pudo guardar la carpeta seleccionada:', error);
          estadoCarpetaPdf.textContent = 'No se pudo guardar la carpeta seleccionada.';
        }
      }
    }

    async function guardarPdfEnCarpeta(blob, nombreArchivo) {
      if (!window.showDirectoryPicker || !carpetaPdfGuias) return false;
      const permisoConcedido = await pedirPermisoCarpeta(carpetaPdfGuias, false);
      if (!permisoConcedido) {
        estadoCarpetaPdf.textContent = 'Pulsa Cambiar carpeta para autorizar el guardado.';
        return false;
      }
      try {
        const archivo = await carpetaPdfGuias.getFileHandle(nombreArchivo, { create: true });
        const escritura = await archivo.createWritable();
        await escritura.write(blob);
        await escritura.close();
        return true;
      } catch (error) {
        console.error('No se pudo escribir el PDF en la carpeta seleccionada:', error);
        estadoCarpetaPdf.textContent = 'No se pudo guardar el PDF en la carpeta seleccionada.';
        return false;

    function crearNombreArchivoGuia(guia) {
      const limpiarNombreArchivo = valor => valor
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '')
        .replace(/[^a-z0-9_-]+/gi, '-')
        .replace(/^-+|-+$/g, '');
      const numeroSeguro = String(guia.numeroGuia).padStart(6, '0');
      const clienteSeguro = limpiarNombreArchivo(guia.nombreCliente) || 'cliente';
      return `GUIA DESPACHO CAJAS ${numeroSeguro} ${clienteSeguro}.pdf`;
    }

    function normalizarBusquedaCliente(valor) {
      return String(valor || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().trim();
    }

    function cerrarSugerenciasClientes() {

    function mostrarSugerenciasClientes() {
      const busqueda = normalizarBusquedaCliente(nombreClienteInput.value);
      sugerenciasClientes.replaceChildren();
      if (!busqueda) {
        cerrarSugerenciasClientes();
        return;
      }

      const coincidencias = clientesGuias
        .map((cliente, indice) => ({ cliente, indice }))
        .filter(({ cliente }) => normalizarBusquedaCliente(`${cliente.nombre} ${cliente.rif}`).includes(busqueda))
        .slice(0, 50);

      if (!coincidencias.length) {
        const vacio = document.createElement('li');
        vacio.className = 'client-suggestions-empty';
        vacio.textContent = 'No se encontraron clientes con ese nombre o RIF.';
        sugerenciasClientes.appendChild(vacio);
      } else {
        coincidencias.forEach(({ cliente, indice }) => {
          const item = document.createElement('li');
          const opcion = document.createElement('button');
          const nombre = document.createElement('span');
          const documento = document.createElement('span');
          opcion.type = 'button';
          opcion.setAttribute('role', 'option');
          opcion.dataset.indiceCliente = String(indice);
          nombre.className = 'client-suggestion-name';
          nombre.textContent = cliente.nombre;
          documento.className = 'client-suggestion-document';
          documento.textContent = cliente.rif ? `RIF: ${cliente.rif}` : '';
          opcion.append(nombre, documento);
          item.appendChild(opcion);
          sugerenciasClientes.appendChild(item);
        });
      }

      sugerenciasClientes.hidden = false;
      nombreClienteInput.setAttribute('aria-expanded', 'true');
    }

    async function cargarClientesGuias(idToken) {
      nombreClienteInput.disabled = true;
      mostrarEstadoSesionGuias('Cargando clientes desde la hoja…');
      try {
        const respuesta = await fetch(URL_API_GUIAS, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8', 'Accept': 'application/json' },
          body: JSON.stringify({ action: 'obtenerClientes', idToken })
        });
        const texto = await respuesta.text();
        let resultado;
        try {
          resultado = JSON.parse(texto);
        } catch (error) {
          throw new Error('El servidor no devolvió JSON válido. Comprueba que el Apps Script esté publicado.');
        }
        if (!respuesta.ok || !resultado.exito || !Array.isArray(resultado.clientes)) {
          throw new Error(resultado.mensaje || 'No se pudieron cargar los clientes.');
        }

        const correlativo = await solicitarCorrelativoGuia('obtenerCorrelativoGuia', idToken);
        numeroGuiaInput.value = String(correlativo);
        correlativoDisponible = true;
        clientesGuias = resultado.clientes.filter(cliente => cliente && String(cliente.nombre || '').trim());
        nombreClienteInput.value = '';
        nombreClienteInput.placeholder = 'Escribe un nombre o RIF para buscar';
        clienteGuiaSeleccionado = null;
        nombreClienteInput.disabled = clientesGuias.length === 0;
        if (!clientesGuias.length) {
          mostrarEstadoSesionGuias('No hay clientes disponibles en la pestaña CLIENTES.', true);
          return;
        }
        mostrarEstadoSesionGuias(`${clientesGuias.length} cliente(s) cargados. Selecciona uno para completar sus datos.`);
      } catch (error) {
        console.error('Error al cargar clientes para las guías:', error);
        credencialGoogleGuias = '';
        correlativoDisponible = false;
        mostrarEstadoSesionGuias(error.message || 'No se pudieron cargar los clientes. Inténtalo de nuevo.', true);
        estadoGuias.textContent = 'No se pudo consultar el correlativo compartido de las guías. Inténtalo de nuevo.';
        estadoGuias.className = 'status-message mt-3 mb-1 error';
      }
    }

    async function solicitarCorrelativoGuia(action, idToken) {
      const respuesta = await fetch(URL_API_GUIAS, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8', 'Accept': 'application/json' },
        body: JSON.stringify({ action, idToken })
      });
      const texto = await respuesta.text();
      let resultado;
      try {
        resultado = JSON.parse(texto);
      } catch (error) {
        throw new Error('El servidor no devolvió JSON válido para el correlativo. Comprueba que el Apps Script esté publicado.');
      }
      const correlativo = Number(resultado.correlativo);
      if (!respuesta.ok || !resultado.exito ||
          !Number.isSafeInteger(correlativo) || correlativo < numeroGuiaInicial) {
        throw new Error(resultado.mensaje || 'No se pudo obtener el correlativo compartido.');
      }
      return correlativo;
    }

    function validarCredencialGoogleGuias(credencial) {
      const partes = String(credencial || '').split('.');
      if (partes.length !== 3) throw new Error('Google no devolvió una credencial válida.');
      const payloadCodificado = partes[1].replace(/-/g, '+').replace(/_/g, '/');
      const payload = JSON.parse(atob(payloadCodificado.padEnd(Math.ceil(payloadCodificado.length / 4) * 4, '=')));
      const correo = String(payload.email || '').trim().toLowerCase();
      const expiracion = Number(payload.exp) * 1000;
      if (payload.email_verified !== true && String(payload.email_verified).toLowerCase() !== 'true') {
        throw new Error(`Verifica el correo ${CORREO_AUTORIZADO_GUIAS} antes de continuar.`);
      }
      if (correo !== CORREO_AUTORIZADO_GUIAS) {
        throw new Error(`Inicia sesión con ${CORREO_AUTORIZADO_GUIAS} para consultar los clientes.`);
      }
      if (!Number.isFinite(expiracion) || expiracion <= Date.now()) {
        throw new Error('La sesión de Google ya venció. Inicia sesión de nuevo.');
      }
      return payload;
    }

    function dibujarTexto(page, text, x, y, maxWidth, font, fontSize, color, centered = false, maxLines = Infinity) {
      const words = String(text).trim().split(/\s+/);
      const lines = [];
      let line = '';
      const agregarPalabra = word => {
        let resto = word;
        while (font.widthOfTextAtSize(resto, fontSize) > maxWidth) {
          let corte = 1;
          while (corte < resto.length && font.widthOfTextAtSize(resto.slice(0, corte + 1), fontSize) <= maxWidth) corte += 1;
          if (line) {
            lines.push(line);
            line = '';
          }
          lines.push(resto.slice(0, corte));
          resto = resto.slice(corte);
        }
        return resto;
      };
      for (const word of words) {
        const palabraAjustada = agregarPalabra(word);
        const candidate = line ? `${line} ${palabraAjustada}` : palabraAjustada;
        if (font.widthOfTextAtSize(candidate, fontSize) > maxWidth && line) {
          lines.push(line);
          line = palabraAjustada;
        } else {
          line = candidate;
        }
      }
      if (line) lines.push(line);
      if (lines.length > maxLines) {
        lines.length = maxLines;
        let lastLine = lines[maxLines - 1].replace(/\s+$/, '');
        while (lastLine && font.widthOfTextAtSize(`${lastLine}...`, fontSize) > maxWidth) {
          lastLine = lastLine.slice(0, -1).replace(/\s+$/, '');
        }
        lines[maxLines - 1] = `${lastLine}...`;
      }
      lines.forEach((content, index) => {
        const lineX = centered ? x + (maxWidth - font.widthOfTextAtSize(content, fontSize)) / 2 : x;
        page.drawText(content, { x: lineX, y: y - index * (fontSize + 3), size: fontSize, font, color });
      });
      return lines.length * (fontSize + 3);
    }

    function dibujarGuia(page, guia, position, fonts, colors, plantilla) {
      const { x, y, width, height } = position;
      const numeroGuiaVisible = guia.numeroGuia.replace(/^gu[ií]a\s*[-:#]?\s*/i, '');
      page.drawPage(plantilla, { x, y, width, height });

      const dibujarValor = (value, left, baseline, maxWidth, maskY, maskHeight, font, fontSize, maxLines) => {
        page.drawRectangle({
          x: left - 1,
          y: maskY,
          width: maxWidth + 2,
          height: maskHeight,
          color: colors.paper
        });
        dibujarTexto(page, value, left, baseline, maxWidth, font, fontSize, colors.text, false, maxLines);
      };

      page.drawRectangle({ x: x + 58, y: y + 295, width: 154, height: 33, color: colors.paper });
      dibujarTexto(page, `GUÍA: ${numeroGuiaVisible}`, x, y + 300.04, width, fonts.bold, 24, colors.orange, true, 1);
      page.drawRectangle({ x: x + 60, y: y + 43, width: 150, height: 20, color: colors.paper });
      const etiquetaBultos = guia.numeroBultos === 1 ? 'BULTO' : 'BULTOS';
      dibujarTexto(page, `${etiquetaBultos} (${guia.numeroBultos})`, x, y + 48, width, fonts.bold, 14, colors.text, true, 1);
      page.drawRectangle({ x: x + 60, y: y + 8, width: 150, height: 40, color: colors.paper });
      dibujarTexto(page, `${guia.bulto}/${guia.numeroBultos}`, x, y + 16.54, width, fonts.bold, 32, colors.orange, true, 1);

      page.drawRectangle({ x: x + 14.77, y: y + 248, width: 241, height: 12, color: colors.paper });
      let tamanoNombreCliente = 12;
      while (tamanoNombreCliente > 7 && fonts.regular.widthOfTextAtSize(guia.nombreCliente, tamanoNombreCliente) > 238) {
        tamanoNombreCliente -= 0.5;
      }
      page.drawText(guia.nombreCliente, {
        x: x + 15.77,
        y: y + 250,
        size: tamanoNombreCliente,
        font: fonts.regular,
        color: colors.text
      });
      page.drawRectangle({ x: x + 140, y: y + 173, width: 113, height: 12, color: colors.paper });
      dibujarTexto(page, guia.nombreVendedor, x + 141, y + 175, 112, fonts.regular, 12, colors.text, false, 1);
      dibujarValor(guia.telefonoCliente, x + 15.77, y + 213.07, 112, y + 211, 12, fonts.regular, 12, 1);
      dibujarValor(guia.telefonoVendedor, x + 141, y + 213.02, 112, y + 211, 12, fonts.regular, 12, 1);
      dibujarValor(guia.numeroDocumento, x + 15.77, y + 176.04, 234, y + 174, 12, fonts.regular, 12, 1);
      dibujarValor(guia.direccionCliente, x + 15.77, y + 135.53, 234, y + 72, 76, fonts.regular, 12, 5);
    }

    function dibujarResumenRespaldo(page, guia, fonts, colors) {
      const margin = 42;
      const contentWidth = 612 - margin * 2;
      const innerX = margin + 24;
      const innerWidth = contentWidth - 48;
      const sectionGap = 18;
      const verticalOffset = 25;

      page.drawRectangle({
        x: margin,
        y: margin,
        width: contentWidth,
        height: 792 - margin * 2,
        borderColor: colors.border,
        borderWidth: 1.2
      });
      dibujarTexto(page, 'LIMZA GROUP C.A. | 0414-4238533', innerX, 710, innerWidth, fonts.bold, 12, colors.text, true);
      dibujarTexto(page, 'COPIA DE RESPALDO', innerX, 660, innerWidth, fonts.bold, 22, colors.text, true);
      page.drawLine({
        start: { x: innerX, y: 660 - verticalOffset },
        end: { x: innerX + innerWidth, y: 660 - verticalOffset },
        thickness: 1.2,
        color: colors.border
      });

      const columnGap = 28;
      const columnWidth = (innerWidth - columnGap) / 2;
      const summaryRows = [
        [
          { label: 'Guía', value: guia.numeroGuia, size: 17 },
          { label: 'Documento', value: guia.numeroDocumento, size: 17 }
        ],
        [
          { label: 'Cliente', value: guia.nombreCliente },
          { label: 'Vendedor', value: guia.nombreVendedor }
        ],
        [
          { label: 'Teléfono cliente', value: guia.telefonoCliente },
          { label: 'Teléfono vendedor', value: guia.telefonoVendedor }
        ],
        [{ label: 'Dirección cliente', value: guia.direccionCliente, size: 15 }]
      ];
      const fieldsForRow = (left, right = null) => right ? [
        { x: innerX, width: columnWidth, ...left },
        { x: innerX + columnWidth + columnGap, width: columnWidth, ...right }
      ] : [{ x: innerX, width: innerWidth, ...left }];
      const measureTextHeight = (text, width, font, fontSize) => {
        const words = String(text).trim().split(/\s+/);
        let line = '';
        let lineCount = 0;
        for (const word of words) {
          const candidate = line ? `${line} ${word}` : word;
          if (font.widthOfTextAtSize(candidate, fontSize) > width && line) {
            lineCount += 1;
            line = word;
          } else {
            line = candidate;
          }
        }
        if (line) lineCount += 1;
        return lineCount * (fontSize + 3);
      };
      const rowHeights = summaryRows.map(([left, right]) =>
        Math.max(...fieldsForRow(left, right).map(field =>
          21 + measureTextHeight(field.value, field.width, fonts.regular, field.size || 16)
        ))
      );
      const detailsTop = 642 - verticalOffset;
      const detailsBottom = 222 - verticalOffset;
      const detailsHeight = rowHeights.reduce((total, rowHeight) =>
        total + rowHeight + 14 + sectionGap, 0
      );
      let cursorY = detailsTop - (detailsTop - detailsBottom - detailsHeight) / 2;
      const drawSummaryRow = (left, right = null, drawSeparator = true) => {
        const fields = fieldsForRow(left, right);
        let rowHeight = 0;
        for (const field of fields) {
          page.drawText(field.label.toUpperCase(), {
            x: field.x,
            y: cursorY,
            size: 10,
            font: fonts.bold,
            color: colors.muted
          });
          const valueHeight = dibujarTexto(
            page,
            field.value,
            field.x,
            cursorY - 21,
            field.width,
            fonts.regular,
            field.size || 16,
            colors.text
          );
          rowHeight = Math.max(rowHeight, 21 + valueHeight);
        }
        const separatorY = cursorY - rowHeight - 14;
        if (drawSeparator) {
          page.drawLine({
            start: { x: innerX, y: separatorY },
            end: { x: innerX + innerWidth, y: separatorY },
            thickness: 0.6,
            color: colors.border
          });
        }
        cursorY = separatorY - sectionGap;
      };

      summaryRows.forEach(([left, right], index) => {
        drawSummaryRow(left, right, index < summaryRows.length - 1);
      });

      page.drawLine({
        start: { x: innerX, y: 202 - verticalOffset },
        end: { x: innerX + innerWidth, y: 202 - verticalOffset },
        thickness: 1.2,
        color: colors.border
      });
      const etiquetaTotalBultos = guia.numeroBultos === 1 ? 'TOTAL DE BULTO' : 'TOTAL DE BULTOS';
      dibujarTexto(page, etiquetaTotalBultos, innerX, 174 - verticalOffset, innerWidth, fonts.bold, 13, colors.text, true);
      dibujarTexto(page, String(guia.numeroBultos), innerX, 118 - verticalOffset, innerWidth, fonts.bold, 38, colors.text, true);
    }

    async function cargarPlantillaGuia(pdf) {
      const respuesta = await fetch('plantilla-guia-despacho.pdf');
      if (!respuesta.ok) throw new Error(`No se pudo cargar la plantilla de guías (${respuesta.status}).`);
      const bytes = await respuesta.arrayBuffer();
      const documentoPlantilla = await PDFLib.PDFDocument.load(bytes);
      const [plantilla] = await pdf.embedPages(
        [documentoPlantilla.getPage(0)],
        [{ left: 30, bottom: 402, right: 300, top: 762 }]
      );
      return plantilla;
    }

    async function generarPdfGuias(guia) {
      if (!window.PDFLib?.PDFDocument) throw new Error(pdfError);
      const { PDFDocument, StandardFonts, rgb } = window.PDFLib;
      const pdf = await PDFDocument.create();
      pdf.setTitle(`Guias ${guia.numeroGuia}`);
      const fonts = {
        regular: await pdf.embedFont(StandardFonts.Helvetica),
        bold: await pdf.embedFont(StandardFonts.HelveticaBold)
      };
      const negro = rgb(0, 0, 0);
      const colors = {
        text: negro,
        muted: rgb(112 / 255, 112 / 255, 112 / 255),
        border: negro,
        orange: rgb(249 / 255, 115 / 255, 22 / 255),
        paper: rgb(1, 1, 1)
      };
      const plantilla = await cargarPlantillaGuia(pdf);
      const margin = 30;
      const gap = 12;
      const cardWidth = (612 - margin * 2 - gap) / 2;
      const cardHeight = (792 - margin * 2 - gap) / 2;
      const positions = [
        { x: margin, y: margin + cardHeight + gap, width: cardWidth, height: cardHeight },
        { x: margin + cardWidth + gap, y: margin + cardHeight + gap, width: cardWidth, height: cardHeight },
        { x: margin, y: margin, width: cardWidth, height: cardHeight },
        { x: margin + cardWidth + gap, y: margin, width: cardWidth, height: cardHeight }
      ];
      for (let start = 1; start <= guia.numeroBultos; start += positions.length) {
        const page = pdf.addPage([612, 792]);
        const end = Math.min(start + positions.length - 1, guia.numeroBultos);
        for (let bulto = start; bulto <= end; bulto += 1) {
          dibujarGuia(page, { ...guia, bulto }, positions[bulto - start], fonts, colors, plantilla);
        }
      }
      dibujarResumenRespaldo(pdf.addPage([612, 792]), guia, fonts, colors);
      return pdf.save();
    }

      if (!clienteGuiaSeleccionado) {
        estadoGuias.textContent = 'Busca y selecciona un cliente de la lista para completar sus datos.';
        estadoGuias.className = 'status-message mt-3 mb-1 error';
        nombreClienteInput.focus();
        return;
      }
      if (!formularioGuias.reportValidity()) return;
      const datos = new FormData(formularioGuias);
      const guia = {
        nombreCliente: String(datos.get('nombreCliente')).trim(),
        nombreVendedor: String(datos.get('nombreVendedor')).trim(),
        direccionCliente: String(datos.get('direccionCliente')).trim(),
        telefonoCliente: String(datos.get('telefonoCliente')).trim(),
        telefonoVendedor: String(datos.get('telefonoVendedor')).trim(),
        numeroDocumento: String(datos.get('numeroDocumento')).trim(),
        numeroGuia: String(datos.get('numeroGuia')).trim(),
        numeroBultos: Number(datos.get('numeroBultos'))
      };
      if (!guia.nombreCliente || !guia.nombreVendedor || !guia.direccionCliente ||
          !guia.telefonoCliente || !guia.telefonoVendedor || !guia.numeroDocumento || !guia.numeroGuia ||
          !Number.isInteger(guia.numeroBultos) || guia.numeroBultos < 1 || guia.numeroBultos > 999) {
        estadoGuias.textContent = 'Revisa los datos ingresados y el número de bultos.';
        estadoGuias.className = 'status-message mt-3 mb-1 error';
        return;
      }
      const nombreArchivoSugerido = crearNombreArchivoGuia(guia);
      let archivoElegido = null;
      if (!carpetaPdfGuias && window.showSaveFilePicker) {
        try {
          archivoElegido = await window.showSaveFilePicker({
            suggestedName: nombreArchivoSugerido,
            types: [{ description: 'Archivo PDF', accept: { 'application/pdf': ['.pdf'] } }]
          });
        } catch (error) {
          if (error.name === 'AbortError') {
            estadoGuias.textContent = 'Guardado cancelado; no se generó la guía.';
            estadoGuias.className = 'status-message mt-3 mb-1';
            return;
          }
          console.error('No se pudo abrir el selector de ubicación del PDF:', error);
          estadoGuias.textContent = 'No se pudo elegir dónde guardar el PDF. Inténtalo nuevamente o selecciona una carpeta.';
          estadoGuias.className = 'status-message mt-3 mb-1 error';
          return;
        }
      }

      botonGenerarGuias.disabled = true;
      estadoGuias.textContent = 'Generando PDF…';
      estadoGuias.className = 'status-message mt-3 mb-1';
      try {
        let numeroReservado;
        try {
          numeroReservado = await solicitarCorrelativoGuia('reservarCorrelativoGuia', credencialGoogleGuias);
        } catch (error) {
          throw new Error(`No se pudo reservar el correlativo compartido: ${error.message}`);
        }
        guia.numeroGuia = String(numeroReservado);
        numeroGuiaInput.value = String(numeroReservado);
        const nombreArchivo = crearNombreArchivoGuia(guia);
        const bytes = await generarPdfGuias(guia);
        const numeroGenerado = Number(guia.numeroGuia);
        const siguienteNumero = numeroGenerado + 1;
        if (!Number.isSafeInteger(siguienteNumero)) {
          throw new Error('El correlativo de las guías alcanzó el límite permitido.');
        }

        const blob = new Blob([bytes], { type: 'application/pdf' });
        let mensajeGuardado;
        if (archivoElegido) {
          const escritura = await archivoElegido.createWritable();
          await escritura.write(blob);
          await escritura.close();
          mensajeGuardado = `PDF guardado en la ubicación elegida: ${nombreArchivo}`;
        } else if (carpetaPdfGuias) {
          const guardadoEnCarpeta = await guardarPdfEnCarpeta(blob, nombreArchivo);
          if (!guardadoEnCarpeta) {
            throw new Error('No se pudo guardar el PDF en la carpeta elegida. Autoriza nuevamente o selecciona otra carpeta.');
          }
          mensajeGuardado = `PDF guardado automáticamente en ${carpetaPdfGuias.name}: ${nombreArchivo}`;
        } else {
          const url = URL.createObjectURL(blob);
          const enlace = document.createElement('a');
          enlace.href = url;
          enlace.download = nombreArchivo;
          document.body.appendChild(enlace);
          enlace.click();
          enlace.remove();
          window.setTimeout(() => URL.revokeObjectURL(url), 1000);
          mensajeGuardado = `${nombreArchivo} se descargó. Revisa la ubicación de descargas configurada en el navegador.`;
        }

        let avisoCorrelativo = '';
        try {
          numeroGuiaInput.value = String(await solicitarCorrelativoGuia('obtenerCorrelativoGuia', credencialGoogleGuias));
        } catch (error) {
          console.error('El PDF se guardó, pero no se pudo actualizar el correlativo mostrado:', error);
          numeroGuiaInput.value = String(siguienteNumero);
          avisoCorrelativo = ' El PDF se guardó, pero no se pudo actualizar el número mostrado; al generar otra guía se consultará el servidor.';
        }
        estadoGuias.textContent = mensajeGuardado + avisoCorrelativo;
        estadoGuias.className = `status-message mt-3 mb-1 ${avisoCorrelativo ? 'error' : 'success'}`;
      } catch (error) {
        console.error('Error al generar las guías de envío:', error);
        const mensajeError = error instanceof Error && (
          error.message.startsWith('El correlativo') ||
          error.message.startsWith('No se pudo reservar el correlativo compartido:') ||
          error.message.startsWith('No se pudo guardar el PDF')
        ) ? error.message : pdfError;
        estadoGuias.textContent = mensajeError;
        estadoGuias.className = 'status-message mt-3 mb-1 error';
      } finally {
        botonGenerarGuias.disabled = false;
      }
    });
  </script>
</body>
</html>
