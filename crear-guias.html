<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">
  <title>Crear guías de envío | LIMZA GROUP</title>
  <link rel="icon" type="image/x-icon" href="https://raw.githubusercontent.com/Limzagroup/Catalogo/main/favicon.ico">
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <style>
    :root {
      color-scheme: light;
      --brand-orange: #f97316;
      --page-bg: #e9ecef;
      --surface: #ffffff;
      --text-main: #0f172a;
      --text-muted: #475569;
      --border-color: #cbd5e1;
    }
    body {
      min-height: 100vh;
      margin: 0;
      background:
        radial-gradient(ellipse at top, rgba(249, 115, 22, 0.07), transparent 38rem),
        var(--page-bg);
      color: var(--text-main);
      font-family: system-ui, -apple-system, sans-serif;
    }
    .topbar {
      background: #000000;
      border-bottom: 3px solid var(--brand-orange);
    }
    .topbar-inner {
      min-height: 87px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }
    .topbar img {
      width: auto;
      max-width: min(220px, 55vw);
      height: auto;
      max-height: 55px;
      object-fit: contain;
    }
    .back-button {
      width: 42px;
      min-width: 42px;
      height: 42px;
      min-height: 42px;
      padding: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1px solid #3a3a3a;
      border-radius: 12px;
      background: #242424;
      color: #ffffff;
      text-decoration: none;
      font-size: 1.25rem;
      -webkit-tap-highlight-color: transparent;
      transition: border-color 0.18s ease, color 0.18s ease;
    }
    .back-button:hover,
    .back-button:focus-visible {
      border-color: var(--brand-orange);
      color: var(--brand-orange);
    }
    main {
      width: min(100% - 32px, 820px);
      margin: 40px auto;
    }
    .form-card {
      padding: clamp(22px, 4.5vw, 42px);
      border: 1px solid #d6dde7;
      border-radius: 22px;
      background: var(--surface);
      box-shadow: 0 18px 48px rgba(15, 23, 42, 0.09);
    }
    .form-heading {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 28px;
      padding-bottom: 22px;
      border-bottom: 1px solid #e8edf3;
    }
    .form-heading-icon {
      width: 48px;
      min-width: 48px;
      height: 48px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(249, 115, 22, 0.18);
      border-radius: 15px;
      background: #fff7ed;
      color: var(--brand-orange);
      font-size: 1.35rem;
    }
    .google-login-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 28px;
      padding: 18px 20px;
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      background: linear-gradient(110deg, #fffaf5, #f8fafc 68%);
    }
    .google-login-copy {
      display: flex;
      align-items: flex-start;
      gap: 13px;
      min-width: 0;
    }
    .google-login-icon {
      width: 40px;
      min-width: 40px;
      height: 40px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(249, 115, 22, 0.18);
      border-radius: 12px;
      background: #ffffff;
      color: var(--brand-orange);
      font-size: 1.1rem;
    }
    .google-login-title {
      margin: 0 0 3px;
      color: var(--text-main);
      font-size: 0.98rem;
      font-weight: 700;
    }
    .google-login-status {
      min-height: 0;
      margin: 0 !important;
      color: var(--text-muted);
      font-size: 0.87rem;
      font-weight: 450;
      line-height: 1.4;
    }
    .google-login-status.error {
      color: #b91c1c;
      font-weight: 600;
    }
    .google-login-status.success {
      color: #166534;
      font-weight: 600;
    }
    #botonGoogleGuias {
      width: 180px;
      min-width: 180px;
      display: flex;
      justify-content: flex-end;
    }
    .google-login-confirmation {
      min-height: 40px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 0 16px;
      border: 1px solid #bbf7d0;
      border-radius: 999px;
      background: #f0fdf4;
      color: #166534;
      font-size: 0.9rem;
      font-weight: 650;
      white-space: nowrap;
    }
    .google-login-confirmation[hidden] {
      display: none;
    }
    h1 {
      margin: 0;
      font-size: clamp(1.4rem, 3.5vw, 1.9rem);
      font-weight: 750;
      letter-spacing: -0.035em;
    }
    #formularioGuias .row {
      --bs-gutter-x: 1.25rem;
      --bs-gutter-y: 1.75rem;
    }
    .outlined-field {
      position: relative;
      min-width: 0;
      border: 2px solid #a8b2c1;
      border-radius: 15px;
      background: #ffffff;
      transition: border-color 0.18s ease, box-shadow 0.18s ease;
    }
    .outlined-field:focus-within {
      border-color: var(--brand-orange);
      box-shadow: 0 0 0 3px rgba(249, 115, 22, 0.16);
    }
    #campoSeleccionCliente:focus-within {
      z-index: 2;
    }
    .client-suggestions {
      position: absolute;
      z-index: 5;
      top: calc(100% + 8px);
      right: 0;
      left: 0;
      max-height: 280px;
      margin: 0;
      padding: 6px;
      overflow-y: auto;
      border: 1px solid #d6dde7;
      border-radius: 12px;
      background: #ffffff;
      box-shadow: 0 12px 28px rgba(15, 23, 42, 0.16);
      list-style: none;
    }
    .client-suggestions[hidden] {
      display: none;
    }
    .client-suggestions button {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 12px;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: var(--text-main);
      text-align: left;
    }
    .client-suggestions button:hover,
    .client-suggestions button:focus-visible {
      outline: none;
      background: #fff7ed;
    }
    .client-suggestion-name {
      min-width: 0;
      overflow: hidden;
      font-weight: 600;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .client-suggestion-document {
      flex-shrink: 0;
      color: var(--text-muted);
      font-size: 0.85rem;
    }
    .client-suggestions-empty {
      padding: 10px 12px;
      color: var(--text-muted);
      font-size: 0.9rem;
    }
    .outlined-field .form-label {
      position: absolute;
      z-index: 1;
      top: -0.82rem;
      left: 17px;
      margin: 0;
      padding: 0 7px;
      background: #ffffff;
      color: #30343d;
      font-size: 0.98rem;
      font-weight: 600;
      line-height: 1.25;
    }
    .outlined-field .form-control {
      width: 100%;
      min-height: 68px;
      padding: 17px 58px 14px 20px;
      border: 0;
      border-radius: inherit;
      background: transparent;
      box-shadow: none;
      color: #30343d;
      font-size: clamp(1rem, 2.2vw, 1.3rem);
    }
    .outlined-field .form-control:focus {
      background: transparent;
      box-shadow: none;
    }
    #nombreCliente::-webkit-search-cancel-button {
      -webkit-appearance: none;
      appearance: none;
      display: none;
    }
    .outlined-field textarea.form-control {
      min-height: 94px;
      resize: vertical;
    }
    .clear-field {
      position: absolute;
      top: 50%;
      right: 15px;
      width: 34px;
      height: 34px;
      padding: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transform: translateY(-50%);
      border: 0;
      border-radius: 50%;
      background: transparent;
      color: #3b3b3b;
      font-size: 1.35rem;
      line-height: 1;
    }
    .clear-field:hover,
    .clear-field:focus-visible {
      background: #f1f5f9;
      color: var(--brand-orange);
      outline: none;
    }
    .btn-primary {
      min-height: 54px;
      border-color: var(--brand-orange);
      background: var(--brand-orange);
      font-weight: 650;
      border-radius: 12px;
      box-shadow: 0 6px 14px rgba(249, 115, 22, 0.2);
      transition: transform 0.18s ease, box-shadow 0.18s ease, background-color 0.18s ease;
    }
    .btn-primary:hover,
    .btn-primary:focus {
      border-color: #ea580c;
      background: #ea580c;
      box-shadow: 0 8px 18px rgba(249, 115, 22, 0.26);
      transform: translateY(-1px);
    }
    .btn-primary:active {
      transform: translateY(0);
    }
    .status-message {
      min-height: 1.25rem;
      margin-top: 12px !important;
      margin-bottom: 0 !important;
      font-size: 0.92rem;
      font-weight: 600;
    }
    .status-message + .btn-primary {
      margin-top: 4px !important;
    }
    .status-message.error {
      color: #b91c1c;
    }
    .status-message.success {
      color: #166534;
    }
    @media (max-width: 575.98px) {
      main {
        width: min(100% - 24px, 480px);
        margin: 22px auto;
      }
      .form-card {
        padding: 22px 18px;
        border-radius: 18px;
      }
      .form-heading {
        gap: 12px;
        margin-bottom: 22px;
        padding-bottom: 18px;
      }
      .google-login-card {
        align-items: flex-start;
        flex-direction: column;
        gap: 12px;
        margin-bottom: 24px;
        padding: 16px;
      }
      #botonGoogleGuias {
        width: 100%;
        min-width: 0;
        justify-content: flex-start;
        padding-left: 53px;
      }
      .form-heading-icon {
        width: 42px;
        min-width: 42px;
        height: 42px;
        border-radius: 13px;
      }
      #formularioGuias .row {
        --bs-gutter-y: 1.4rem;
      }
      .outlined-field {
        border-radius: 14px;
      }
      .outlined-field .form-control {
        min-height: 64px;
        padding-left: 16px;
        font-size: 1.05rem;
      }
      .outlined-field textarea.form-control {
        min-height: 88px;
      }
      .outlined-field .form-label {
        left: 13px;
      }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="container topbar-inner">
      <img src="https://raw.githubusercontent.com/Limzagroup/Catalogo/main/LOGO_LIMZA_WHITE.webp" alt="LIMZA GROUP" width="220" height="55">
      <a class="back-button" href="index.html" aria-label="Volver al catálogo" title="Volver al catálogo">
        <i class="bi bi-arrow-left" aria-hidden="true"></i>
      </a>
    </div>
  </header>
  <main>
    <section class="form-card" aria-labelledby="pageTitle">
      <div class="form-heading">
        <span class="form-heading-icon" aria-hidden="true">
          <i class="bi bi-box-seam"></i>
        </span>
        <h1 id="pageTitle">Crear guías de envío</h1>
      </div>
      <div class="google-login-card">
        <div class="google-login-copy">
          <span class="google-login-icon" aria-hidden="true"><i class="bi bi-shield-lock"></i></span>
          <div>
            <p class="google-login-title">Acceso a clientes</p>
            <p id="estadoSesionGuias" class="google-login-status" role="status" aria-live="polite">Inicia sesión con Google para cargar los clientes.</p>
          </div>
        </div>
        <div id="botonGoogleGuias"></div>
        <div id="estadoAccesoGoogleGuias" class="google-login-confirmation" role="status" aria-live="polite" hidden>
          <i class="bi bi-check-circle-fill" aria-hidden="true"></i>
          <span>Sesión iniciada</span>
        </div>
      </div>
      <form id="formularioGuias">
        <div class="row g-3">
          <div class="col-12 col-md-6">
            <div class="outlined-field" id="campoSeleccionCliente">
              <label class="form-label" for="nombreCliente">Seleccionar cliente</label>
              <input class="form-control" id="nombreCliente" name="nombreCliente" type="text" placeholder="Busca por nombre o RIF" autocomplete="off" role="combobox" aria-autocomplete="list" aria-controls="sugerenciasClientes" aria-expanded="false" required disabled>
              <ul class="client-suggestions" id="sugerenciasClientes" role="listbox" aria-label="Clientes coincidentes" hidden></ul>
              <button class="clear-field" type="button" data-clear-for="nombreCliente" aria-label="Borrar nombre del cliente"><i class="bi bi-x-lg" aria-hidden="true"></i></button>
            </div>
          </div>
          <div class="col-12 col-md-6">
            <div class="outlined-field">
              <label class="form-label" for="nombreVendedor">Nombre del vendedor</label>
              <input class="form-control" id="nombreVendedor" name="nombreVendedor" maxlength="120" required>
              <button class="clear-field" type="button" data-clear-for="nombreVendedor" aria-label="Borrar nombre del vendedor"><i class="bi bi-x-lg" aria-hidden="true"></i></button>
            </div>
          </div>
          <div class="col-12">
            <div class="outlined-field">
              <label class="form-label" for="direccionCliente">Dirección de entrega</label>
              <textarea class="form-control" id="direccionCliente" name="direccionCliente" rows="2" maxlength="250" required></textarea>
              <button class="clear-field" type="button" data-clear-for="direccionCliente" aria-label="Borrar dirección de entrega"><i class="bi bi-x-lg" aria-hidden="true"></i></button>
            </div>
          </div>
          <div class="col-md-6">
            <div class="outlined-field">
              <label class="form-label" for="telefonoCliente">Teléfono del cliente</label>
              <input class="form-control" id="telefonoCliente" name="telefonoCliente" type="tel" autocomplete="tel" maxlength="30" required>
              <button class="clear-field" type="button" data-clear-for="telefonoCliente" aria-label="Borrar teléfono del cliente"><i class="bi bi-x-lg" aria-hidden="true"></i></button>
            </div>
          </div>
          <div class="col-md-6">
            <div class="outlined-field">
              <label class="form-label" for="telefonoVendedor">Teléfono del vendedor</label>
              <input class="form-control" id="telefonoVendedor" name="telefonoVendedor" type="tel" maxlength="30" required>
              <button class="clear-field" type="button" data-clear-for="telefonoVendedor" aria-label="Borrar teléfono del vendedor"><i class="bi bi-x-lg" aria-hidden="true"></i></button>
            </div>
          </div>
          <div class="col-md-6">
            <div class="outlined-field">
              <label class="form-label" for="numeroDocumento">Número de documento</label>
              <input class="form-control" id="numeroDocumento" name="numeroDocumento" maxlength="60" required>
              <button class="clear-field" type="button" data-clear-for="numeroDocumento" aria-label="Borrar número de documento"><i class="bi bi-x-lg" aria-hidden="true"></i></button>
            </div>
          </div>
          <div class="col-md-6">
            <div class="outlined-field">
              <label class="form-label" for="numeroGuia">Número de guía</label>
              <input class="form-control" id="numeroGuia" name="numeroGuia" type="number" min="540" step="1" readonly required>
            </div>
          </div>
          <div class="col-md-6">
            <div class="outlined-field">
              <label class="form-label" for="numeroBultos">Número de bultos</label>
              <input class="form-control" id="numeroBultos" name="numeroBultos" type="number" min="1" max="999" step="1" value="1" required>
            </div>
          </div>
        </div>
        <p id="estadoGuias" class="status-message mt-3 mb-1" role="status" aria-live="polite"></p>
        <button id="btnGenerarGuias" class="btn btn-primary w-100 mt-2" type="submit">
          <i class="bi bi-file-earmark-pdf me-2" aria-hidden="true"></i>Generar PDF de guías
        </button>
      </form>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
  <script src="https://accounts.google.com/gsi/client" defer></script>
  <script>
    const URL_API_GUIAS = 'https://script.google.com/macros/s/AKfycbz6CAkq2nh-FnyUE6jE4dTmwPbIkFog10jEr4xuJp11-XbqB_mceR5AAiIhuuoIiw8kCg/exec';
    const GOOGLE_CLIENT_ID_GUIAS = '359363906061-o8q5s2068sbbmon7ohsgnvctvlm12ls6.apps.googleusercontent.com';
    const CORREO_AUTORIZADO_GUIAS = 'limzagroup0@gmail.com';
    const formularioGuias = document.getElementById('formularioGuias');
    const botonGenerarGuias = document.getElementById('btnGenerarGuias');
    const estadoGuias = document.getElementById('estadoGuias');
    const estadoSesionGuias = document.getElementById('estadoSesionGuias');
    const botonGoogleGuias = document.getElementById('botonGoogleGuias');
    const estadoAccesoGoogleGuias = document.getElementById('estadoAccesoGoogleGuias');
    const nombreClienteInput = document.getElementById('nombreCliente');
    const sugerenciasClientes = document.getElementById('sugerenciasClientes');
    const numeroGuiaInput = document.getElementById('numeroGuia');
    const claveSiguienteNumeroGuia = 'limzagroupSiguienteNumeroGuia';
    const numeroGuiaInicial = 540;
    const pdfError = 'No se pudo generar el PDF. Recarga la página e inténtalo de nuevo.';
    let clientesGuias = [];
    let clienteGuiaSeleccionado = null;
    let credencialGoogleGuias = '';
    let correlativoDisponible = true;

    function normalizarBusquedaCliente(valor) {
      return String(valor || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().trim();
    }

    function cerrarSugerenciasClientes() {
      sugerenciasClientes.hidden = true;
      nombreClienteInput.setAttribute('aria-expanded', 'false');
    }

    function completarDatosCliente(cliente) {
      clienteGuiaSeleccionado = cliente;
      if (cliente) nombreClienteInput.value = cliente.nombre;
      document.getElementById('direccionCliente').value = cliente ? cliente.direccionCliente || '' : '';
      document.getElementById('telefonoCliente').value = cliente ? cliente.telefonoCliente || '' : '';
      document.getElementById('numeroDocumento').value = cliente ? cliente.numeroDocumento || '' : '';
      document.getElementById('nombreVendedor').value = cliente ? cliente.nombreVendedor || '' : '';
      document.getElementById('telefonoVendedor').value = cliente ? cliente.telefonoVendedor || '' : '';
      cerrarSugerenciasClientes();
    }

    function mostrarSugerenciasClientes() {
      const busqueda = normalizarBusquedaCliente(nombreClienteInput.value);
      sugerenciasClientes.replaceChildren();
      if (!busqueda) {
        cerrarSugerenciasClientes();
        return;
      }

      const coincidencias = clientesGuias
        .map((cliente, indice) => ({ cliente, indice }))
        .filter(({ cliente }) => normalizarBusquedaCliente(`${cliente.nombre} ${cliente.numeroDocumento}`).includes(busqueda))
        .slice(0, 50);

      if (!coincidencias.length) {
        const vacio = document.createElement('li');
        vacio.className = 'client-suggestions-empty';
        vacio.textContent = 'No se encontraron clientes con ese nombre o RIF.';
        sugerenciasClientes.appendChild(vacio);
      } else {
        coincidencias.forEach(({ cliente, indice }) => {
          const item = document.createElement('li');
          const opcion = document.createElement('button');
          const nombre = document.createElement('span');
          const documento = document.createElement('span');
          opcion.type = 'button';
          opcion.setAttribute('role', 'option');
          opcion.dataset.indiceCliente = String(indice);
          nombre.className = 'client-suggestion-name';
          nombre.textContent = cliente.nombre;
          documento.className = 'client-suggestion-document';
          documento.textContent = cliente.numeroDocumento ? `RIF: ${cliente.numeroDocumento}` : '';
          opcion.append(nombre, documento);
          item.appendChild(opcion);
          sugerenciasClientes.appendChild(item);
        });
      }

      sugerenciasClientes.hidden = false;
      nombreClienteInput.setAttribute('aria-expanded', 'true');
    }

    function mostrarEstadoSesionGuias(mensaje, error = false) {
      estadoSesionGuias.textContent = mensaje;
      estadoSesionGuias.className = `google-login-status${error ? ' error' : ''}`;
    }

    async function cargarClientesGuias(idToken) {
      nombreClienteInput.disabled = true;
      mostrarEstadoSesionGuias('Cargando clientes desde la hoja…');
      try {
        const respuesta = await fetch(URL_API_GUIAS, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8', 'Accept': 'application/json' },
          body: JSON.stringify({ action: 'obtenerClientes', idToken })
        });
        const texto = await respuesta.text();
        let resultado;
        try {
          resultado = JSON.parse(texto);
        } catch (error) {
          throw new Error('El servidor no devolvió JSON válido. Comprueba que el Apps Script esté publicado.');
        }
        if (!respuesta.ok || !resultado.exito || !Array.isArray(resultado.clientes)) {
          throw new Error(resultado.mensaje || 'No se pudieron cargar los clientes.');
        }

        clientesGuias = resultado.clientes.filter(cliente => cliente && String(cliente.nombre || '').trim());
        nombreClienteInput.value = '';
        nombreClienteInput.placeholder = 'Escribe un nombre o RIF para buscar';
        clienteGuiaSeleccionado = null;
        nombreClienteInput.disabled = clientesGuias.length === 0;
        if (!clientesGuias.length) {
          mostrarEstadoSesionGuias('No hay clientes disponibles en la pestaña CLIENTES.', true);
          return;
        }
        mostrarEstadoSesionGuias(`${clientesGuias.length} cliente(s) cargados. Selecciona uno para completar sus datos.`);
      } catch (error) {
        console.error('Error al cargar clientes para las guías:', error);
        credencialGoogleGuias = '';
        mostrarEstadoSesionGuias(error.message || 'No se pudieron cargar los clientes. Inténtalo de nuevo.', true);
      }
    }

    function recibirCredencialGoogleGuias(respuesta) {
      try {
        const partes = String(respuesta.credential || '').split('.');
        if (partes.length !== 3) throw new Error('Google no devolvió una credencial válida.');
        const payloadCodificado = partes[1].replace(/-/g, '+').replace(/_/g, '/');
        const payload = JSON.parse(atob(payloadCodificado.padEnd(Math.ceil(payloadCodificado.length / 4) * 4, '=')));
        const correo = String(payload.email || '').trim().toLowerCase();
        const expiracion = Number(payload.exp) * 1000;
        if (String(payload.email_verified).toLowerCase() !== 'true' || correo !== CORREO_AUTORIZADO_GUIAS) {
          throw new Error(`Inicia sesión con ${CORREO_AUTORIZADO_GUIAS} para consultar los clientes.`);
        }
        if (!Number.isFinite(expiracion) || expiracion <= Date.now()) {
          throw new Error('La sesión de Google ya venció. Inicia sesión de nuevo.');
        }
        credencialGoogleGuias = respuesta.credential;
        botonGoogleGuias.hidden = true;
        estadoAccesoGoogleGuias.hidden = false;
        cargarClientesGuias(credencialGoogleGuias);
      } catch (error) {
        credencialGoogleGuias = '';
        botonGoogleGuias.hidden = false;
        estadoAccesoGoogleGuias.hidden = true;
        nombreClienteInput.disabled = true;
        mostrarEstadoSesionGuias(error.message || 'No se pudo validar la sesión de Google.', true);
      }
    }

    function inicializarGoogleGuias() {
      if (!window.google?.accounts?.id) {
        mostrarEstadoSesionGuias('No se pudo cargar el inicio de sesión de Google. Recarga la página e inténtalo de nuevo.', true);
        return;
      }
      window.google.accounts.id.initialize({
        client_id: GOOGLE_CLIENT_ID_GUIAS,
        callback: recibirCredencialGoogleGuias
      });
      window.google.accounts.id.renderButton(botonGoogleGuias, {
        type: 'standard',
        theme: 'outline',
        size: 'large',
        text: 'signin_with',
        shape: 'pill',
        width: 180,
        logo_alignment: 'left'
      });
    }

    function obtenerSiguienteNumeroGuia() {
      const guardado = localStorage.getItem(claveSiguienteNumeroGuia);
      if (guardado === null) return numeroGuiaInicial;
      const numero = Number(guardado);
      if (!Number.isSafeInteger(numero) || numero < numeroGuiaInicial) {
        throw new Error('El correlativo guardado para las guías no es válido.');
      }
      return numero;
    }

    try {
      numeroGuiaInput.value = String(obtenerSiguienteNumeroGuia());
    } catch (error) {
      correlativoDisponible = false;
      console.error('No se pudo cargar el correlativo de las guías:', error);
      estadoGuias.textContent = 'No se pudo cargar el correlativo de las guías. Recarga la página e inténtalo de nuevo.';
      estadoGuias.className = 'status-message mt-3 mb-1 error';
    }

    document.querySelectorAll('.clear-field').forEach(button => {
      button.addEventListener('click', () => {
        const field = document.getElementById(button.dataset.clearFor);
        if (!field) throw new Error(`No se encontró el campo ${button.dataset.clearFor}.`);
        field.value = '';
        field.dispatchEvent(new Event('input', { bubbles: true }));
        field.dispatchEvent(new Event('change', { bubbles: true }));
        field.focus();
      });
    });

    nombreClienteInput.addEventListener('input', () => {
      clienteGuiaSeleccionado = null;
      completarDatosCliente(null);
      mostrarSugerenciasClientes();
    });

    nombreClienteInput.addEventListener('keydown', event => {
      if (event.key === 'Escape') {
        cerrarSugerenciasClientes();
        return;
      }
      if (event.key === 'Enter' && !sugerenciasClientes.hidden) {
        const primeraOpcion = sugerenciasClientes.querySelector('button[data-indice-cliente]');
        if (primeraOpcion) {
          event.preventDefault();
          completarDatosCliente(clientesGuias[Number(primeraOpcion.dataset.indiceCliente)]);
        }
      }
    });

    sugerenciasClientes.addEventListener('click', event => {
      const opcion = event.target.closest('button[data-indice-cliente]');
      if (opcion) completarDatosCliente(clientesGuias[Number(opcion.dataset.indiceCliente)]);
    });

    window.addEventListener('load', inicializarGoogleGuias, { once: true });

    function dibujarTexto(page, text, x, y, maxWidth, font, fontSize, color, centered = false) {
      const words = String(text).trim().split(/\s+/);
      const lines = [];
      let line = '';
      for (const word of words) {
        const candidate = line ? `${line} ${word}` : word;
        if (font.widthOfTextAtSize(candidate, fontSize) > maxWidth && line) {
          lines.push(line);
          line = word;
        } else {
          line = candidate;
        }
      }
      if (line) lines.push(line);
      lines.forEach((content, index) => {
        const lineX = centered ? x + (maxWidth - font.widthOfTextAtSize(content, fontSize)) / 2 : x;
        page.drawText(content, { x: lineX, y: y - index * (fontSize + 3), size: fontSize, font, color });
      });
      return lines.length * (fontSize + 3);
    }

    function dibujarGuia(page, guia, position, fonts, colors) {
      const { x, y, width, height } = position;
      const inset = 18;
      const contentWidth = width - inset * 2;
      const numeroGuiaVisible = guia.numeroGuia.replace(/^gu[ií]a\s*[-:#]?\s*/i, '');
      const blockTop = y + height - 18;
      const sectionGap = 12;
      let cursorY = blockTop;

      page.drawRectangle({
        x, y, width, height,
        borderColor: colors.border,
        borderWidth: 1.2
      });

      cursorY -= dibujarTexto(page, 'LIMZA GROUP C.A. | 0414-4238533', x + inset, cursorY, contentWidth, fonts.bold, 13, colors.muted, true);
      cursorY -= 10;
      const guiaTitleY = cursorY;
      cursorY -= dibujarTexto(page, `GUÍA - ${numeroGuiaVisible}`, x + inset, cursorY, contentWidth, fonts.bold, 23, colors.orange, true);
      cursorY -= 8;
      const firstLabelY = cursorY - 14;
      const lineY = (guiaTitleY + firstLabelY + 6) / 2;
      page.drawLine({
        start: { x: x + inset, y: lineY },
        end: { x: x + width - inset, y: lineY },
        thickness: 0.8,
        color: colors.border
      });
      cursorY -= 14;

      const drawField = (label, value, size = 11) => {
        const labelY = cursorY;
        page.drawText(label.toUpperCase(), {
          x: x + inset, y: labelY, size: 8, font: fonts.bold, color: colors.muted
        });
        const valueHeight = dibujarTexto(page, value, x + inset, labelY - 13, contentWidth, fonts.regular, size, colors.text);
        cursorY = labelY - 13 - valueHeight - sectionGap;
      };

      const drawPairedFields = (leftLabel, leftValue, rightLabel, rightValue) => {
        const columnGap = 12;
        const columnWidth = (contentWidth - columnGap) / 2;
        const leftX = x + inset;
        const rightX = leftX + columnWidth + columnGap;
        const labelY = cursorY;
        page.drawText(leftLabel.toUpperCase(), {
          x: leftX, y: labelY, size: 8, font: fonts.bold, color: colors.muted
        });
        page.drawText(rightLabel.toUpperCase(), {
          x: rightX, y: labelY, size: 8, font: fonts.bold, color: colors.muted
        });
        const leftHeight = dibujarTexto(page, leftValue, leftX, labelY - 13, columnWidth, fonts.regular, 11, colors.text);
        const rightHeight = dibujarTexto(page, rightValue, rightX, labelY - 13, columnWidth, fonts.regular, 11, colors.text);
        cursorY = labelY - 13 - Math.max(leftHeight, rightHeight) - sectionGap;
      };

      drawPairedFields('Cliente', guia.nombreCliente, 'Vendedor', guia.nombreVendedor);
      drawPairedFields('Teléfono cliente', guia.telefonoCliente, 'Teléfono vendedor', guia.telefonoVendedor);
      drawField('Dirección cliente', guia.direccionCliente, 11);
      drawField('Documento', guia.numeroDocumento, 13);

      const etiquetaBultos = guia.numeroBultos === 1 ? 'BULTO' : 'BULTOS';
      dibujarTexto(page, `${etiquetaBultos} (${guia.numeroBultos})`, x + inset, y + 41, contentWidth, fonts.bold, 13, colors.muted, true);
      dibujarTexto(page, `${guia.bulto}/${guia.numeroBultos}`, x + inset, y + 9, contentWidth, fonts.bold, 32, colors.text, true);
    }

    function dibujarResumenRespaldo(page, guia, fonts, colors) {
      const margin = 42;
      const contentWidth = 612 - margin * 2;
      const innerX = margin + 24;
      const innerWidth = contentWidth - 48;
      const sectionGap = 18;
      const verticalOffset = 25;

      page.drawRectangle({
        x: margin,
        y: margin,
        width: contentWidth,
        height: 792 - margin * 2,
        borderColor: colors.border,
        borderWidth: 1.2
      });
      dibujarTexto(page, 'LIMZA GROUP C.A. | 0414-4238533', innerX, 718 - verticalOffset, innerWidth, fonts.bold, 14, colors.muted, true);
      dibujarTexto(page, 'COPIA DE RESPALDO', innerX, 685 - verticalOffset, innerWidth, fonts.bold, 22, colors.orange, true);
      page.drawLine({
        start: { x: innerX, y: 660 - verticalOffset },
        end: { x: innerX + innerWidth, y: 660 - verticalOffset },
        thickness: 1.2,
        color: colors.border
      });

      const columnGap = 28;
      const columnWidth = (innerWidth - columnGap) / 2;
      const summaryRows = [
        [
          { label: 'Guía', value: guia.numeroGuia, size: 17 },
          { label: 'Documento', value: guia.numeroDocumento, size: 17 }
        ],
        [
          { label: 'Cliente', value: guia.nombreCliente },
          { label: 'Vendedor', value: guia.nombreVendedor }
        ],
        [
          { label: 'Teléfono cliente', value: guia.telefonoCliente },
          { label: 'Teléfono vendedor', value: guia.telefonoVendedor }
        ],
        [{ label: 'Dirección cliente', value: guia.direccionCliente, size: 15 }]
      ];
      const fieldsForRow = (left, right = null) => right ? [
        { x: innerX, width: columnWidth, ...left },
        { x: innerX + columnWidth + columnGap, width: columnWidth, ...right }
      ] : [{ x: innerX, width: innerWidth, ...left }];
      const measureTextHeight = (text, width, font, fontSize) => {
        const words = String(text).trim().split(/\s+/);
        let line = '';
        let lineCount = 0;
        for (const word of words) {
          const candidate = line ? `${line} ${word}` : word;
          if (font.widthOfTextAtSize(candidate, fontSize) > width && line) {
            lineCount += 1;
            line = word;
          } else {
            line = candidate;
          }
        }
        if (line) lineCount += 1;
        return lineCount * (fontSize + 3);
      };
      const rowHeights = summaryRows.map(([left, right]) =>
        Math.max(...fieldsForRow(left, right).map(field =>
          21 + measureTextHeight(field.value, field.width, fonts.regular, field.size || 16)
        ))
      );
      const detailsTop = 642 - verticalOffset;
      const detailsBottom = 222 - verticalOffset;
      const detailsHeight = rowHeights.reduce((total, rowHeight) =>
        total + rowHeight + 14 + sectionGap, 0
      );
      let cursorY = detailsTop - (detailsTop - detailsBottom - detailsHeight) / 2;
      const drawSummaryRow = (left, right = null, drawSeparator = true) => {
        const fields = fieldsForRow(left, right);
        let rowHeight = 0;
        for (const field of fields) {
          page.drawText(field.label.toUpperCase(), {
            x: field.x,
            y: cursorY,
            size: 10,
            font: fonts.bold,
            color: colors.muted
          });
          const valueHeight = dibujarTexto(
            page,
            field.value,
            field.x,
            cursorY - 21,
            field.width,
            fonts.regular,
            field.size || 16,
            colors.text
          );
          rowHeight = Math.max(rowHeight, 21 + valueHeight);
        }
        const separatorY = cursorY - rowHeight - 14;
        if (drawSeparator) {
          page.drawLine({
            start: { x: innerX, y: separatorY },
            end: { x: innerX + innerWidth, y: separatorY },
            thickness: 0.6,
            color: colors.border
          });
        }
        cursorY = separatorY - sectionGap;
      };

      summaryRows.forEach(([left, right], index) => {
        drawSummaryRow(left, right, index < summaryRows.length - 1);
      });

      page.drawLine({
        start: { x: innerX, y: 202 - verticalOffset },
        end: { x: innerX + innerWidth, y: 202 - verticalOffset },
        thickness: 1.2,
        color: colors.orange
      });
      const etiquetaTotalBultos = guia.numeroBultos === 1 ? 'TOTAL DE BULTO' : 'TOTAL DE BULTOS';
      dibujarTexto(page, etiquetaTotalBultos, innerX, 174 - verticalOffset, innerWidth, fonts.bold, 13, colors.muted, true);
      dibujarTexto(page, String(guia.numeroBultos), innerX, 118 - verticalOffset, innerWidth, fonts.bold, 38, colors.orange, true);
    }

    async function generarPdfGuias(guia) {
      if (!window.PDFLib?.PDFDocument) throw new Error(pdfError);
      const { PDFDocument, StandardFonts, rgb } = window.PDFLib;
      const pdf = await PDFDocument.create();
      pdf.setTitle(`Guias ${guia.numeroGuia}`);
      const fonts = {
        regular: await pdf.embedFont(StandardFonts.Helvetica),
        bold: await pdf.embedFont(StandardFonts.HelveticaBold)
      };
      const colors = {
        text: rgb(15 / 255, 23 / 255, 42 / 255),
        muted: rgb(71 / 255, 85 / 255, 105 / 255),
        border: rgb(203 / 255, 213 / 255, 225 / 255),
        orange: rgb(234 / 255, 88 / 255, 12 / 255)
      };
      const margin = 30;
      const gap = 12;
      const cardWidth = (612 - margin * 2 - gap) / 2;
      const cardHeight = (792 - margin * 2 - gap) / 2;
      const positions = [
        { x: margin, y: margin + cardHeight + gap, width: cardWidth, height: cardHeight },
        { x: margin + cardWidth + gap, y: margin + cardHeight + gap, width: cardWidth, height: cardHeight },
        { x: margin, y: margin, width: cardWidth, height: cardHeight },
        { x: margin + cardWidth + gap, y: margin, width: cardWidth, height: cardHeight }
      ];
      for (let start = 1; start <= guia.numeroBultos; start += positions.length) {
        const page = pdf.addPage([612, 792]);
        const end = Math.min(start + positions.length - 1, guia.numeroBultos);
        for (let bulto = start; bulto <= end; bulto += 1) {
          dibujarGuia(page, { ...guia, bulto }, positions[bulto - start], fonts, colors);
        }
      }
      dibujarResumenRespaldo(pdf.addPage([612, 792]), guia, fonts, colors);
      return pdf.save();
    }

    formularioGuias.addEventListener('submit', async event => {
      event.preventDefault();
      if (!correlativoDisponible) {
        estadoGuias.textContent = 'No se pudo cargar el correlativo de las guías. Recarga la página e inténtalo de nuevo.';
        estadoGuias.className = 'status-message mt-3 mb-1 error';
        return;
      }
      if (!credencialGoogleGuias || !clientesGuias.length || nombreClienteInput.disabled) {
        mostrarEstadoSesionGuias('Inicia sesión con Google para cargar y seleccionar un cliente antes de generar la guía.', true);
        return;
      }
      if (!clienteGuiaSeleccionado) {
        estadoGuias.textContent = 'Busca y selecciona un cliente de la lista para completar sus datos.';
        estadoGuias.className = 'status-message mt-3 mb-1 error';
        nombreClienteInput.focus();
        return;
      }
      if (!formularioGuias.reportValidity()) return;
      const datos = new FormData(formularioGuias);
      const guia = {
        nombreCliente: String(datos.get('nombreCliente')).trim(),
        nombreVendedor: String(datos.get('nombreVendedor')).trim(),
        direccionCliente: String(datos.get('direccionCliente')).trim(),
        telefonoCliente: String(datos.get('telefonoCliente')).trim(),
        telefonoVendedor: String(datos.get('telefonoVendedor')).trim(),
        numeroDocumento: String(datos.get('numeroDocumento')).trim(),
        numeroGuia: String(datos.get('numeroGuia')).trim(),
        numeroBultos: Number(datos.get('numeroBultos'))
      };
      if (!guia.nombreCliente || !guia.nombreVendedor || !guia.direccionCliente ||
          !guia.telefonoCliente || !guia.telefonoVendedor || !guia.numeroDocumento || !guia.numeroGuia ||
          !Number.isInteger(guia.numeroBultos) || guia.numeroBultos < 1 || guia.numeroBultos > 999) {
        estadoGuias.textContent = 'Revisa los datos ingresados y el número de bultos.';
        estadoGuias.className = 'status-message mt-3 mb-1 error';
        return;
      }
      botonGenerarGuias.disabled = true;
      estadoGuias.textContent = 'Generando PDF…';
      estadoGuias.className = 'status-message mt-3 mb-1';
      try {
        const bytes = await generarPdfGuias(guia);
        const siguienteNumero = Number(guia.numeroGuia) + 1;
        if (!Number.isSafeInteger(siguienteNumero)) {
          throw new Error('El correlativo de las guías alcanzó el límite permitido.');
        }
        localStorage.setItem(claveSiguienteNumeroGuia, String(siguienteNumero));
        numeroGuiaInput.value = String(siguienteNumero);
        const blob = new Blob([bytes], { type: 'application/pdf' });
        const url = URL.createObjectURL(blob);
        const enlace = document.createElement('a');
        const limpiarNombreArchivo = valor => valor
          .normalize('NFD')
          .replace(/[\u0300-\u036f]/g, '')
          .replace(/[^a-z0-9_-]+/gi, '-')
          .replace(/^-+|-+$/g, '');
        const numeroSeguro = String(guia.numeroGuia).padStart(6, '0');
        const clienteSeguro = limpiarNombreArchivo(guia.nombreCliente) || 'cliente';
        enlace.href = url;
        enlace.download = `GUIA DESPACHO CAJAS ${numeroSeguro} ${clienteSeguro}.pdf`;
        document.body.appendChild(enlace);
        enlace.click();
        enlace.remove();
        window.setTimeout(() => URL.revokeObjectURL(url), 1000);
        estadoGuias.textContent = `PDF generado: ${guia.numeroBultos} guía(s) y una hoja de respaldo.`;
        estadoGuias.className = 'status-message mt-3 mb-1 success';
      } catch (error) {
        console.error('Error al generar las guías de envío:', error);
        estadoGuias.textContent = error instanceof Error && error.message.startsWith('El correlativo')
          ? error.message
          : pdfError;
        estadoGuias.className = 'status-message mt-3 mb-1 error';
      } finally {
        botonGenerarGuias.disabled = false;
      }
    });
  </script>
</body>
