<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">
  <title>Crear guías de envío | LIMZA GROUP</title>
  <link rel="icon" type="image/x-icon" href="https://raw.githubusercontent.com/Limzagroup/Catalogo/main/favicon.ico">
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <style>
    :root {
      color-scheme: light;
      --brand-orange: #f97316;
      --page-bg: #e9ecef;
      --surface: #ffffff;
      --text-main: #0f172a;
      --text-muted: #475569;
      --border-color: #cbd5e1;
    }
    body {
      min-height: 100vh;
      margin: 0;
      background:
        radial-gradient(ellipse at top, rgba(249, 115, 22, 0.07), transparent 38rem),
        var(--page-bg);
      color: var(--text-main);
      font-family: system-ui, -apple-system, sans-serif;
    }
    .topbar {
      background: #000000;
      border-bottom: 3px solid var(--brand-orange);
    }
    .topbar-inner {
      min-height: 87px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }
    .topbar img {
      width: auto;
      max-width: min(220px, 55vw);
      height: auto;
      max-height: 55px;
      object-fit: contain;
    }
    .back-button {
      width: 42px;
      min-width: 42px;
      height: 42px;
      min-height: 42px;
      padding: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1px solid #3a3a3a;
      border-radius: 12px;
      background: #242424;
      color: #ffffff;
      text-decoration: none;
      font-size: 1.25rem;
      -webkit-tap-highlight-color: transparent;
      transition: border-color 0.18s ease, color 0.18s ease;
    }
    .back-button:hover,
    .back-button:focus-visible {
      border-color: var(--brand-orange);
      color: var(--brand-orange);
    }
    main {
      width: min(100% - 32px, 820px);
      margin: 40px auto;
    }
    .form-card {
      padding: clamp(22px, 4.5vw, 42px);
      border: 1px solid #d6dde7;
      border-radius: 22px;
      background: var(--surface);
      box-shadow: 0 18px 48px rgba(15, 23, 42, 0.09);
    }
    .form-heading {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 28px;
      padding-bottom: 22px;
      border-bottom: 1px solid #e8edf3;
    }
    .form-heading-icon {
      width: 48px;
      min-width: 48px;
      height: 48px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(249, 115, 22, 0.18);
      border-radius: 15px;
      background: #fff7ed;
      color: var(--brand-orange);
      font-size: 1.35rem;
    }
    h1 {
      margin: 0;
      font-size: clamp(1.4rem, 3.5vw, 1.9rem);
      font-weight: 750;
      letter-spacing: -0.035em;
    }
    #formularioGuias .row {
      --bs-gutter-x: 1.25rem;
      --bs-gutter-y: 1.75rem;
    }
    .outlined-field {
      position: relative;
      min-width: 0;
      border: 2px solid #a8b2c1;
      border-radius: 15px;
      background: #ffffff;
      transition: border-color 0.18s ease, box-shadow 0.18s ease;
    }
    .outlined-field:focus-within {
      border-color: var(--brand-orange);
      box-shadow: 0 0 0 3px rgba(249, 115, 22, 0.16);
    }
    .outlined-field .form-label {
      position: absolute;
      z-index: 1;
      top: -0.82rem;
      left: 17px;
      margin: 0;
      padding: 0 7px;
      background: #ffffff;
      color: #30343d;
      font-size: 0.98rem;
      font-weight: 600;
      line-height: 1.25;
    }
    .outlined-field .form-control {
      width: 100%;
      min-height: 68px;
      padding: 17px 58px 14px 20px;
      border: 0;
      border-radius: inherit;
      background: transparent;
      box-shadow: none;
      color: #30343d;
      font-size: clamp(1rem, 2.2vw, 1.3rem);
    }
    .outlined-field .form-control:focus {
      background: transparent;
      box-shadow: none;
    }
    .outlined-field textarea.form-control {
      min-height: 94px;
      resize: vertical;
    }
    .clear-field {
      position: absolute;
      top: 50%;
      right: 15px;
      width: 34px;
      height: 34px;
      padding: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transform: translateY(-50%);
      border: 0;
      border-radius: 50%;
      background: transparent;
      color: #3b3b3b;
      font-size: 1.35rem;
      line-height: 1;
    }
    .clear-field:hover,
    .clear-field:focus-visible {
      background: #f1f5f9;
      color: var(--brand-orange);
      outline: none;
    }
    .btn-primary {
      min-height: 54px;
      border-color: var(--brand-orange);
      background: var(--brand-orange);
      font-weight: 650;
      border-radius: 12px;
      box-shadow: 0 6px 14px rgba(249, 115, 22, 0.2);
      transition: transform 0.18s ease, box-shadow 0.18s ease, background-color 0.18s ease;
    }
    .btn-primary:hover,
    .btn-primary:focus {
      border-color: #ea580c;
      background: #ea580c;
      box-shadow: 0 8px 18px rgba(249, 115, 22, 0.26);
      transform: translateY(-1px);
    }
    .btn-primary:active {
      transform: translateY(0);
    }
    .status-message {
      min-height: 1.25rem;
      margin-top: 12px !important;
      margin-bottom: 0 !important;
      font-size: 0.92rem;
      font-weight: 600;
    }
    .status-message + .btn-primary {
      margin-top: 4px !important;
    }
    .status-message.error {
      color: #b91c1c;
    }
    .status-message.success {
      color: #166534;
    }
    @media (max-width: 575.98px) {
      main {
        width: min(100% - 24px, 480px);
        margin: 22px auto;
      }
      .form-card {
        padding: 22px 18px;
        border-radius: 18px;
      }
      .form-heading {
        gap: 12px;
        margin-bottom: 22px;
        padding-bottom: 18px;
      }
      .form-heading-icon {
        width: 42px;
        min-width: 42px;
        height: 42px;
        border-radius: 13px;
      }
      #formularioGuias .row {
        --bs-gutter-y: 1.4rem;
      }
      .outlined-field {
        border-radius: 14px;
      }
      .outlined-field .form-control {
        min-height: 64px;
        padding-left: 16px;
        font-size: 1.05rem;
      }
      .outlined-field textarea.form-control {
        min-height: 88px;
      }
      .outlined-field .form-label {
        left: 13px;
      }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="container topbar-inner">
      <img src="https://raw.githubusercontent.com/Limzagroup/Catalogo/main/LOGO_LIMZA_WHITE.webp" alt="LIMZA GROUP" width="220" height="55">
      <a class="back-button" href="index.html" aria-label="Volver al catálogo" title="Volver al catálogo">
        <i class="bi bi-arrow-left" aria-hidden="true"></i>
      </a>
    </div>
  </header>
  <main>
    <section class="form-card" aria-labelledby="pageTitle">
      <div class="form-heading">
        <span class="form-heading-icon" aria-hidden="true">
          <i class="bi bi-box-seam"></i>
        </span>
        <h1 id="pageTitle">Crear guías de envío</h1>
      </div>
      <form id="formularioGuias">
        <div class="row g-3">
          <div class="col-12 col-md-6">
            <div class="outlined-field">
              <label class="form-label" for="nombreCliente">Nombre del cliente</label>
              <input class="form-control" id="nombreCliente" name="nombreCliente" autocomplete="name" maxlength="120" required>
              <button class="clear-field" type="button" data-clear-for="nombreCliente" aria-label="Borrar nombre del cliente"><i class="bi bi-x-lg" aria-hidden="true"></i></button>
            </div>
          </div>
          <div class="col-12 col-md-6">
            <div class="outlined-field">
              <label class="form-label" for="nombreVendedor">Nombre del vendedor</label>
              <input class="form-control" id="nombreVendedor" name="nombreVendedor" maxlength="120" required>
              <button class="clear-field" type="button" data-clear-for="nombreVendedor" aria-label="Borrar nombre del vendedor"><i class="bi bi-x-lg" aria-hidden="true"></i></button>
            </div>
          </div>
          <div class="col-12">
            <div class="outlined-field">
              <label class="form-label" for="direccionCliente">Dirección de entrega</label>
              <textarea class="form-control" id="direccionCliente" name="direccionCliente" rows="2" maxlength="250" required></textarea>
              <button class="clear-field" type="button" data-clear-for="direccionCliente" aria-label="Borrar dirección de entrega"><i class="bi bi-x-lg" aria-hidden="true"></i></button>
            </div>
          </div>
          <div class="col-md-6">
            <div class="outlined-field">
              <label class="form-label" for="telefonoCliente">Teléfono del cliente</label>
              <input class="form-control" id="telefonoCliente" name="telefonoCliente" type="tel" autocomplete="tel" maxlength="30" required>
              <button class="clear-field" type="button" data-clear-for="telefonoCliente" aria-label="Borrar teléfono del cliente"><i class="bi bi-x-lg" aria-hidden="true"></i></button>
            </div>
          </div>
          <div class="col-md-6">
            <div class="outlined-field">
              <label class="form-label" for="telefonoVendedor">Teléfono del vendedor</label>
              <input class="form-control" id="telefonoVendedor" name="telefonoVendedor" type="tel" maxlength="30" required>
              <button class="clear-field" type="button" data-clear-for="telefonoVendedor" aria-label="Borrar teléfono del vendedor"><i class="bi bi-x-lg" aria-hidden="true"></i></button>
            </div>
          </div>
          <div class="col-md-6">
            <div class="outlined-field">
              <label class="form-label" for="numeroDocumento">Número de documento</label>
              <input class="form-control" id="numeroDocumento" name="numeroDocumento" maxlength="60" required>
              <button class="clear-field" type="button" data-clear-for="numeroDocumento" aria-label="Borrar número de documento"><i class="bi bi-x-lg" aria-hidden="true"></i></button>
            </div>
          </div>
          <div class="col-md-6">
            <div class="outlined-field">
              <label class="form-label" for="numeroGuia">Número de guía</label>
              <input class="form-control" id="numeroGuia" name="numeroGuia" maxlength="60" required>
              <button class="clear-field" type="button" data-clear-for="numeroGuia" aria-label="Borrar número de guía"><i class="bi bi-x-lg" aria-hidden="true"></i></button>
            </div>
          </div>
          <div class="col-md-6">
            <div class="outlined-field">
              <label class="form-label" for="numeroBultos">Número de bultos</label>
              <input class="form-control" id="numeroBultos" name="numeroBultos" type="number" min="1" max="999" step="1" value="1" required>
            </div>
          </div>
        </div>
        <p id="estadoGuias" class="status-message mt-3 mb-1" role="status" aria-live="polite"></p>
        <button id="btnGenerarGuias" class="btn btn-primary w-100 mt-2" type="submit">
          <i class="bi bi-file-earmark-pdf me-2" aria-hidden="true"></i>Generar PDF de guías
        </button>
      </form>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
  <script>
    const formularioGuias = document.getElementById('formularioGuias');
    const botonGenerarGuias = document.getElementById('btnGenerarGuias');
    const estadoGuias = document.getElementById('estadoGuias');
    const pdfError = 'No se pudo generar el PDF. Recarga la página e inténtalo de nuevo.';

    document.querySelectorAll('.clear-field').forEach(button => {
      button.addEventListener('click', () => {
        const field = document.getElementById(button.dataset.clearFor);
        if (!field) throw new Error(`No se encontró el campo ${button.dataset.clearFor}.`);
        field.value = '';
        field.dispatchEvent(new Event('input', { bubbles: true }));
        field.focus();
      });
    });

    function dibujarTexto(page, text, x, y, maxWidth, font, fontSize, color, centered = false) {
      const words = String(text).trim().split(/\s+/);
      const lines = [];
      let line = '';
      for (const word of words) {
        const candidate = line ? `${line} ${word}` : word;
        if (font.widthOfTextAtSize(candidate, fontSize) > maxWidth && line) {
          lines.push(line);
          line = word;
        } else {
          line = candidate;
        }
      }
      if (line) lines.push(line);
      lines.forEach((content, index) => {
        const lineX = centered ? x + (maxWidth - font.widthOfTextAtSize(content, fontSize)) / 2 : x;
        page.drawText(content, { x: lineX, y: y - index * (fontSize + 3), size: fontSize, font, color });
      });
      return lines.length * (fontSize + 3);
    }

    function dibujarGuia(page, guia, position, fonts, colors) {
      const { x, y, width, height } = position;
      const inset = 18;
      const contentWidth = width - inset * 2;
      const numeroGuiaVisible = guia.numeroGuia.replace(/^gu[ií]a\s*[-:#]?\s*/i, '');
      const blockTop = y + height - 18;
      const sectionGap = 12;
      let cursorY = blockTop;

      page.drawRectangle({
        x, y, width, height,
        borderColor: colors.border,
        borderWidth: 1.2
      });

      cursorY -= dibujarTexto(page, 'LIMZA GROUP C.A. | 0414-4238533', x + inset, cursorY, contentWidth, fonts.bold, 13, colors.muted, true);
      cursorY -= 10;
      const guiaTitleY = cursorY;
      cursorY -= dibujarTexto(page, `GUÍA - ${numeroGuiaVisible}`, x + inset, cursorY, contentWidth, fonts.bold, 23, colors.orange, true);
      cursorY -= 8;
      const firstLabelY = cursorY - 14;
      const lineY = (guiaTitleY + firstLabelY + 6) / 2;
      page.drawLine({
        start: { x: x + inset, y: lineY },
        end: { x: x + width - inset, y: lineY },
        thickness: 0.8,
        color: colors.border
      });
      cursorY -= 14;

      const drawField = (label, value, size = 11) => {
        const labelY = cursorY;
        page.drawText(label.toUpperCase(), {
          x: x + inset, y: labelY, size: 8, font: fonts.bold, color: colors.muted
        });
        const valueHeight = dibujarTexto(page, value, x + inset, labelY - 13, contentWidth, fonts.regular, size, colors.text);
        cursorY = labelY - 13 - valueHeight - sectionGap;
      };

      const drawPairedFields = (leftLabel, leftValue, rightLabel, rightValue) => {
        const columnGap = 12;
        const columnWidth = (contentWidth - columnGap) / 2;
        const leftX = x + inset;
        const rightX = leftX + columnWidth + columnGap;
        const labelY = cursorY;
        page.drawText(leftLabel.toUpperCase(), {
          x: leftX, y: labelY, size: 8, font: fonts.bold, color: colors.muted
        });
        page.drawText(rightLabel.toUpperCase(), {
          x: rightX, y: labelY, size: 8, font: fonts.bold, color: colors.muted
        });
        const leftHeight = dibujarTexto(page, leftValue, leftX, labelY - 13, columnWidth, fonts.regular, 11, colors.text);
        const rightHeight = dibujarTexto(page, rightValue, rightX, labelY - 13, columnWidth, fonts.regular, 11, colors.text);
        cursorY = labelY - 13 - Math.max(leftHeight, rightHeight) - sectionGap;
      };

      drawPairedFields('Cliente', guia.nombreCliente, 'Vendedor', guia.nombreVendedor);
      drawPairedFields('Teléfono cliente', guia.telefonoCliente, 'Teléfono vendedor', guia.telefonoVendedor);
      drawField('Dirección cliente', guia.direccionCliente, 11);
      drawField('Documento', guia.numeroDocumento, 13);

      const etiquetaBultos = guia.numeroBultos === 1 ? 'BULTO' : 'BULTOS';
      dibujarTexto(page, `${etiquetaBultos} (${guia.numeroBultos})`, x + inset, y + 41, contentWidth, fonts.bold, 13, colors.muted, true);
      dibujarTexto(page, `${guia.bulto}/${guia.numeroBultos}`, x + inset, y + 9, contentWidth, fonts.bold, 32, colors.text, true);
    }

    function dibujarResumenRespaldo(page, guia, fonts, colors) {
      const margin = 42;
      const contentWidth = 612 - margin * 2;
      const innerX = margin + 24;
      const innerWidth = contentWidth - 48;
      const sectionGap = 18;
      const verticalOffset = 25;

      page.drawRectangle({
        x: margin,
        y: margin,
        width: contentWidth,
        height: 792 - margin * 2,
        borderColor: colors.border,
        borderWidth: 1.2
      });
      dibujarTexto(page, 'LIMZA GROUP C.A. | 0414-4238533', innerX, 718 - verticalOffset, innerWidth, fonts.bold, 14, colors.muted, true);
      dibujarTexto(page, 'COPIA DE RESPALDO', innerX, 685 - verticalOffset, innerWidth, fonts.bold, 22, colors.orange, true);
      page.drawLine({
        start: { x: innerX, y: 660 - verticalOffset },
        end: { x: innerX + innerWidth, y: 660 - verticalOffset },
        thickness: 1.2,
        color: colors.border
      });

      const columnGap = 28;
      const columnWidth = (innerWidth - columnGap) / 2;
      const summaryRows = [
        [
          { label: 'Guía', value: guia.numeroGuia, size: 17 },
          { label: 'Documento', value: guia.numeroDocumento, size: 17 }
        ],
        [
          { label: 'Cliente', value: guia.nombreCliente },
          { label: 'Vendedor', value: guia.nombreVendedor }
        ],
        [
          { label: 'Teléfono cliente', value: guia.telefonoCliente },
          { label: 'Teléfono vendedor', value: guia.telefonoVendedor }
        ],
        [{ label: 'Dirección cliente', value: guia.direccionCliente, size: 15 }]
      ];
      const fieldsForRow = (left, right = null) => right ? [
        { x: innerX, width: columnWidth, ...left },
        { x: innerX + columnWidth + columnGap, width: columnWidth, ...right }
      ] : [{ x: innerX, width: innerWidth, ...left }];
      const measureTextHeight = (text, width, font, fontSize) => {
        const words = String(text).trim().split(/\s+/);
        let line = '';
        let lineCount = 0;
        for (const word of words) {
          const candidate = line ? `${line} ${word}` : word;
          if (font.widthOfTextAtSize(candidate, fontSize) > width && line) {
            lineCount += 1;
            line = word;
          } else {
            line = candidate;
          }
        }
        if (line) lineCount += 1;
        return lineCount * (fontSize + 3);
      };
      const rowHeights = summaryRows.map(([left, right]) =>
        Math.max(...fieldsForRow(left, right).map(field =>
          21 + measureTextHeight(field.value, field.width, fonts.regular, field.size || 16)
        ))
      );
      const detailsTop = 642 - verticalOffset;
      const detailsBottom = 222 - verticalOffset;
      const detailsHeight = rowHeights.reduce((total, rowHeight) =>
        total + rowHeight + 14 + sectionGap, 0
      );
      let cursorY = detailsTop - (detailsTop - detailsBottom - detailsHeight) / 2;
      const drawSummaryRow = (left, right = null, drawSeparator = true) => {
        const fields = fieldsForRow(left, right);
        let rowHeight = 0;
        for (const field of fields) {
          page.drawText(field.label.toUpperCase(), {
            x: field.x,
            y: cursorY,
            size: 10,
            font: fonts.bold,
            color: colors.muted
          });
          const valueHeight = dibujarTexto(
            page,
            field.value,
            field.x,
            cursorY - 21,
            field.width,
            fonts.regular,
            field.size || 16,
            colors.text
          );
          rowHeight = Math.max(rowHeight, 21 + valueHeight);
        }
        const separatorY = cursorY - rowHeight - 14;
        if (drawSeparator) {
          page.drawLine({
            start: { x: innerX, y: separatorY },
            end: { x: innerX + innerWidth, y: separatorY },
            thickness: 0.6,
            color: colors.border
          });
        }
        cursorY = separatorY - sectionGap;
      };

      summaryRows.forEach(([left, right], index) => {
        drawSummaryRow(left, right, index < summaryRows.length - 1);
      });

      page.drawLine({
        start: { x: innerX, y: 202 - verticalOffset },
        end: { x: innerX + innerWidth, y: 202 - verticalOffset },
        thickness: 1.2,
        color: colors.orange
      });
      const etiquetaTotalBultos = guia.numeroBultos === 1 ? 'TOTAL DE BULTO' : 'TOTAL DE BULTOS';
      dibujarTexto(page, etiquetaTotalBultos, innerX, 174 - verticalOffset, innerWidth, fonts.bold, 13, colors.muted, true);
      dibujarTexto(page, String(guia.numeroBultos), innerX, 118 - verticalOffset, innerWidth, fonts.bold, 38, colors.orange, true);
    }

    async function generarPdfGuias(guia) {
      if (!window.PDFLib?.PDFDocument) throw new Error(pdfError);
      const { PDFDocument, StandardFonts, rgb } = window.PDFLib;
      const pdf = await PDFDocument.create();
      pdf.setTitle(`Guias ${guia.numeroGuia}`);
      const fonts = {
        regular: await pdf.embedFont(StandardFonts.Helvetica),
        bold: await pdf.embedFont(StandardFonts.HelveticaBold)
      };
      const colors = {
        text: rgb(15 / 255, 23 / 255, 42 / 255),
        muted: rgb(71 / 255, 85 / 255, 105 / 255),
        border: rgb(203 / 255, 213 / 255, 225 / 255),
        orange: rgb(234 / 255, 88 / 255, 12 / 255)
      };
      const margin = 30;
      const gap = 12;
      const cardWidth = (612 - margin * 2 - gap) / 2;
      const cardHeight = (792 - margin * 2 - gap) / 2;
      const positions = [
        { x: margin, y: margin + cardHeight + gap, width: cardWidth, height: cardHeight },
        { x: margin + cardWidth + gap, y: margin + cardHeight + gap, width: cardWidth, height: cardHeight },
        { x: margin, y: margin, width: cardWidth, height: cardHeight },
        { x: margin + cardWidth + gap, y: margin, width: cardWidth, height: cardHeight }
      ];
      for (let start = 1; start <= guia.numeroBultos; start += positions.length) {
        const page = pdf.addPage([612, 792]);
        const end = Math.min(start + positions.length - 1, guia.numeroBultos);
        for (let bulto = start; bulto <= end; bulto += 1) {
          dibujarGuia(page, { ...guia, bulto }, positions[bulto - start], fonts, colors);
        }
      }
      dibujarResumenRespaldo(pdf.addPage([612, 792]), guia, fonts, colors);
      return pdf.save();
    }

    formularioGuias.addEventListener('submit', async event => {
      event.preventDefault();
      if (!formularioGuias.reportValidity()) return;
      const datos = new FormData(formularioGuias);
      const guia = {
        nombreCliente: String(datos.get('nombreCliente')).trim(),
        nombreVendedor: String(datos.get('nombreVendedor')).trim(),
        direccionCliente: String(datos.get('direccionCliente')).trim(),
        telefonoCliente: String(datos.get('telefonoCliente')).trim(),
        telefonoVendedor: String(datos.get('telefonoVendedor')).trim(),
        numeroDocumento: String(datos.get('numeroDocumento')).trim(),
        numeroGuia: String(datos.get('numeroGuia')).trim(),
        numeroBultos: Number(datos.get('numeroBultos'))
      };
      if (!guia.nombreCliente || !guia.nombreVendedor || !guia.direccionCliente ||
          !guia.telefonoCliente || !guia.telefonoVendedor || !guia.numeroDocumento || !guia.numeroGuia ||
          !Number.isInteger(guia.numeroBultos) || guia.numeroBultos < 1 || guia.numeroBultos > 999) {
        estadoGuias.textContent = 'Revisa los datos ingresados y el número de bultos.';
        estadoGuias.className = 'status-message mt-3 mb-1 error';
        return;
      }
      botonGenerarGuias.disabled = true;
      estadoGuias.textContent = 'Generando PDF…';
      estadoGuias.className = 'status-message mt-3 mb-1';
      try {
        const bytes = await generarPdfGuias(guia);
        const blob = new Blob([bytes], { type: 'application/pdf' });
        const url = URL.createObjectURL(blob);
        const enlace = document.createElement('a');
        const limpiarNombreArchivo = valor => valor
          .normalize('NFD')
          .replace(/[\u0300-\u036f]/g, '')
          .replace(/[^a-z0-9_-]+/gi, '-')
          .replace(/^-+|-+$/g, '');
        const numeroSeguro = limpiarNombreArchivo(guia.numeroGuia.replace(/^gu[ií]a\s*[-:#]?\s*/i, '')) || 'sin-numero';
        const clienteSeguro = limpiarNombreArchivo(guia.nombreCliente) || 'cliente';
        enlace.href = url;
        enlace.download = `Guia-${numeroSeguro}-${clienteSeguro}.pdf`;
        document.body.appendChild(enlace);
        enlace.click();
        enlace.remove();
        window.setTimeout(() => URL.revokeObjectURL(url), 1000);
        estadoGuias.textContent = `PDF generado: ${guia.numeroBultos} guía(s) y una hoja de respaldo.`;
        estadoGuias.className = 'status-message mt-3 mb-1 success';
      } catch (error) {
        console.error('Error al generar las guías de envío:', error);
        estadoGuias.textContent = pdfError;
        estadoGuias.className = 'status-message mt-3 mb-1 error';
      } finally {
        botonGenerarGuias.disabled = false;
      }
    });
  </script>
</body>
</html>
